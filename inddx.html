<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>MASTER BIOMEDS</title>

  <link rel="stylesheet"
  href="style.css">

</head>
<body>

  <div class="container">

    <div class="box">

      <h1>
        MASTER BIOMEDS
      </h1>

      <p>
        Register & Verify Account
      </p>

      <!-- REGISTER -->

      <form id="registerForm">

        <input
        type="text"
        id="username"
        placeholder="Username"
        required>

        <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

        <input
        type="password"
        id="password"
        placeholder="Password"
        required>

        <button type="submit">
          Register Account
        </button>

      </form>

      <!-- VERIFY -->

      <form id="verifyForm">

        <input
        type="text"
        id="code"
        placeholder="Verification Code"
        required>

        <button type="submit">
          Verify Account
        </button>

      </form>

      <!-- LOGIN -->

      <form id="loginForm">

        <input
        type="email"
        id="loginEmail"
        placeholder="Email Address"
        required>

        <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required>

        <button type="submit">
          Login
        </button>

      </form>

      <div id="message"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
