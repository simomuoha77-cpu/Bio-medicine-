<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MASTER BIOMEDS</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sora',sans-serif;
  background:#071018;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(0,217,255,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 70%,rgba(0,102,255,0.06) 0%,transparent 70%);
}
.box{
  position:relative;z-index:1;
  width:420px;max-width:95vw;
  background:#0b1622;
  border:1px solid rgba(0,217,255,0.08);
  border-radius:20px;
  padding:44px 38px;
}
.logo{text-align:center;margin-bottom:32px;}
.logo h1{font-size:22px;font-weight:700;color:#00d9ff;margin-bottom:6px;}
.logo p{font-size:13px;color:#5a7a8a;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;color:#5a7a8a;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.field input{
  width:100%;background:#111d29;border:1px solid rgba(0,217,255,0.08);
  border-radius:10px;padding:14px 16px;color:white;
  font-family:'Sora',sans-serif;font-size:14px;outline:none;transition:border-color .2s;
}
.field input:focus{border-color:rgba(0,217,255,0.3);}

.btn-submit{
  width:100%;padding:15px;background:linear-gradient(135deg,#00d9ff,#0066ff);
  border:none;border-radius:10px;color:#000;font-family:'Sora',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .2s;margin-top:6px;
}
.btn-submit:hover{opacity:.88;transform:translateY(-1px);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.msg{
  text-align:center;font-size:13px;margin-top:14px;
  padding:10px;border-radius:8px;display:none;
}
.msg.error{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);color:#ff4757;}
.msg.success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.2);color:#00ff88;}

.bottom{text-align:center;margin-top:20px;font-size:13px;color:#5a7a8a;}
.bottom a{color:#00d9ff;text-decoration:none;font-weight:600;}
.bottom a:hover{text-decoration:underline;}

.loader{display:none;width:18px;height:18px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>

<div class="box">
  <div class="logo">
    <h1><i class="fa-solid fa-heart-pulse"></i> MASTER BIOMEDS</h1>
    <p>Sign in to your account</p>
  </div>

  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-submit" id="login-btn" onclick="doLogin()">
    <span id="btn-text"><i class="fa-solid fa-right-to-bracket"></i> Sign In</span>
    <div class="loader" id="loader"></div>
  </button>

  <div class="msg" id="msg"></div>

  <div class="bottom">
    Don't have an account? <a href="/register.html">Register here</a>
  </div>
</div>

<script>
// If already logged in, go straight to dashboard
if (localStorage.getItem("biomeds_token")) {
  window.location.href = "/dashboard.html";
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") doLogin();
});

async function doLogin() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn      = document.getElementById("login-btn");
  const btnText  = document.getElementById("btn-text");
  const loader   = document.getElementById("loader");
  const msg      = document.getElementById("msg");

  msg.style.display = "none";

  if (!email || !password) {
    showMsg("Please fill in all fields", "error");
    return;
  }

  // Show loading
  btn.disabled        = true;
  btnText.style.display = "none";
  loader.style.display  = "block";

  try {
    const res  = await fetch("/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {
      // ✅ SAVE TOKEN AND USER
      localStorage.setItem("biomeds_token", data.token);
      localStorage.setItem("biomeds_user",  JSON.stringify(data.user));

      showMsg("Login successful! Redirecting...", "success");

      // ✅ REDIRECT TO DASHBOARD
      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 800);

    } else {
      showMsg(data.message || "Login failed", "error");
      btn.disabled        = false;
      btnText.style.display = "inline";
      loader.style.display  = "none";
    }

  } catch (err) {
    showMsg("Connection error. Is the server running?", "error");
    btn.disabled        = false;
    btnText.style.display = "inline";
    loader.style.display  = "none";
  }
}

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent    = text;
  el.className      = "msg " + type;
  el.style.display  = "block";
}
</script>
</body>
</html>
