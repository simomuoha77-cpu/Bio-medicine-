<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MASTER BIOMEDS</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sora',sans-serif;
  background:#071018;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(0,217,255,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 70%,rgba(0,102,255,0.06) 0%,transparent 70%);
}
.box{
  position:relative;z-index:1;
  width:420px;max-width:95vw;
  background:#0b1622;
  border:1px solid rgba(0,217,255,0.08);
  border-radius:20px;
  padding:44px 38px;
}
.logo{text-align:center;margin-bottom:32px;}
.logo h1{font-size:22px;font-weight:700;color:#00d9ff;margin-bottom:6px;}
.logo p{font-size:13px;color:#5a7a8a;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;color:#5a7a8a;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.field input{
  width:100%;background:#111d29;border:1px solid rgba(0,217,255,0.08);
  border-radius:10px;padding:14px 16px;color:white;
  font-family:'Sora',sans-serif;font-size:14px;outline:none;transition:border-color .2s;
}
.field input:focus{border-color:rgba(0,217,255,0.3);}

.btn-submit{
  width:100%;padding:15px;background:linear-gradient(135deg,#00d9ff,#0066ff);
  border:none;border-radius:10px;color:#000;font-family:'Sora',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .2s;margin-top:6px;
}
.btn-submit:hover{opacity:.88;transform:translateY(-1px);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.msg{
  text-align:center;font-size:13px;margin-top:14px;
  padding:10px;border-radius:8px;display:none;
}
.msg.error{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);color:#ff4757;}
.msg.success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.2);color:#00ff88;}

.bottom{text-align:center;margin-top:20px;font-size:13px;color:#5a7a8a;}
.bottom a{color:#00d9ff;text-decoration:none;font-weight:600;}
.bottom a:hover{text-decoration:underline;}

.loader{display:none;width:18px;height:18px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>

<div class="box">
  <div class="logo">
    <h1><i class="fa-solid fa-heart-pulse"></i> MASTER BIOMEDS</h1>
    <p>Sign in to your account</p>
  </div>

  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <div style="text-align:right;margin-bottom:6px;">
    <a href="#" onclick="showForgot();return false;" style="color:#00d9ff;font-size:12px;text-decoration:none;">Forgot password?</a>
  </div>

  <button class="btn-submit" id="login-btn" onclick="doLogin()">
    <span id="btn-text"><i class="fa-solid fa-right-to-bracket"></i> Sign In</span>
    <div class="loader" id="loader"></div>
  </button>

  <div class="msg" id="msg"></div>

  <div class="bottom">
    Don't have an account? <a href="/register.html">Register here</a>
  </div>
</div>

<!-- FORGOT PASSWORD -->
<div class="box" id="forgot-box" style="display:none;">
  <div class="logo">
    <h1><i class="fa-solid fa-key"></i> Reset Password</h1>
    <p id="forgot-sub">Enter your account email to receive a reset code</p>
  </div>

  <div id="forgot-step1">
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="forgot-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <button class="btn-submit" id="forgot-btn1" onclick="sendResetCode()">
      <span id="forgot-btn1-text"><i class="fa-solid fa-paper-plane"></i> Send Reset Code</span>
      <div class="loader" id="forgot-loader1"></div>
    </button>
  </div>

  <div id="forgot-step2" style="display:none;">
    <div class="field">
      <label>6-Digit Code</label>
      <input type="text" id="reset-otp" placeholder="123456" maxlength="6" inputmode="numeric">
    </div>
    <div class="field">
      <label>New Password</label>
      <input type="password" id="reset-newpass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="forgot-btn2" onclick="submitReset()">
      <span id="forgot-btn2-text"><i class="fa-solid fa-check"></i> Reset Password</span>
      <div class="loader" id="forgot-loader2"></div>
    </button>
  </div>

  <div class="msg" id="forgot-msg"></div>

  <div class="bottom">
    <a href="#" onclick="showLogin();return false;">← Back to Sign In</a>
  </div>
</div>

<!-- VERIFY EMAIL (for unverified accounts trying to log in) -->
<div class="box" id="verify-box" style="display:none;">
  <div class="logo">
    <h1><i class="fa-solid fa-envelope-circle-check"></i> Verify Your Email</h1>
    <p>Enter the code sent to <strong id="verify-email-shown" style="color:#00d9ff;"></strong></p>
  </div>

  <div class="field">
    <label>Verification Code</label>
    <input type="text" id="login-verify-otp" placeholder="123456" maxlength="6" inputmode="numeric">
  </div>
  <button class="btn-submit" id="verify-login-btn" onclick="doVerifyFromLogin()">
    <span id="verify-login-btn-text"><i class="fa-solid fa-check"></i> Verify & Sign In</span>
    <div class="loader" id="verify-login-loader"></div>
  </button>

  <div class="msg" id="verify-login-msg"></div>

  <div class="bottom">
    Didn't get a code? <a href="#" onclick="resendLoginVerify();return false;">Resend</a><br><br>
    <a href="#" onclick="showLogin();return false;">← Back to Sign In</a>
  </div>
</div>

<script>
// If already logged in, go straight to dashboard
if (localStorage.getItem("biomeds_token")) {
  window.location.href = "/dashboard.html";
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") doLogin();
});

async function doLogin() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn      = document.getElementById("login-btn");
  const btnText  = document.getElementById("btn-text");
  const loader   = document.getElementById("loader");
  const msg      = document.getElementById("msg");

  msg.style.display = "none";

  if (!email || !password) {
    showMsg("Please fill in all fields", "error");
    return;
  }

  // Show loading
  btn.disabled        = true;
  btnText.style.display = "none";
  loader.style.display  = "block";

  try {
    const res  = await fetch("/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {
      // ✅ SAVE TOKEN AND USER
      localStorage.setItem("biomeds_token", data.token);
      localStorage.setItem("biomeds_user",  JSON.stringify(data.user));

      showMsg("Login successful! Redirecting...", "success");

      // ✅ REDIRECT TO DASHBOARD
      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 800);

    } else if (data.needsVerification) {
      pendingVerifyEmail = data.email || email;
      pendingVerifyPassword = password;
      document.getElementById("verify-email-shown").textContent = pendingVerifyEmail;
      document.querySelector('.box').style.display='none';
      document.getElementById('verify-box').style.display='block';
      btn.disabled        = false;
      btnText.style.display = "inline";
      loader.style.display  = "none";
    } else {
      showMsg(data.message || "Login failed", "error");
      btn.disabled        = false;
      btnText.style.display = "inline";
      loader.style.display  = "none";
    }

  } catch (err) {
    showMsg("Connection error. Is the server running?", "error");
    btn.disabled        = false;
    btnText.style.display = "inline";
    loader.style.display  = "none";
  }
}

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent    = text;
  el.className      = "msg " + type;
  el.style.display  = "block";
}

// ── FORGOT PASSWORD FLOW ──
function showForgot(){
  document.querySelector('.box').style.display='none';
  document.getElementById('forgot-box').style.display='block';
}
function showLogin(){
  document.getElementById('forgot-box').style.display='none';
  document.getElementById('verify-box').style.display='none';
  document.querySelector('.box').style.display='block';
  document.getElementById('forgot-step1').style.display='block';
  document.getElementById('forgot-step2').style.display='none';
  document.getElementById('forgot-msg').style.display='none';
}
function showForgotMsg(text,type){
  const el=document.getElementById('forgot-msg');
  el.textContent=text; el.className='msg '+type; el.style.display='block';
}

let resetEmail='';

async function sendResetCode(){
  const email=document.getElementById('forgot-email').value.trim();
  if(!email){ showForgotMsg('Please enter your email','error'); return; }
  const btn=document.getElementById('forgot-btn1'), btnText=document.getElementById('forgot-btn1-text'), loader=document.getElementById('forgot-loader1');
  btn.disabled=true; btnText.style.display='none'; loader.style.display='block';
  document.getElementById('forgot-msg').style.display='none';
  try{
    const res=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const data=await res.json();
    resetEmail=email;
    showForgotMsg(data.message,'success');
    document.getElementById('forgot-step1').style.display='none';
    document.getElementById('forgot-step2').style.display='block';
    document.getElementById('forgot-sub').textContent='Enter the code sent to '+email;
  }catch(e){
    showForgotMsg('Connection error. Try again.','error');
  }
  btn.disabled=false; btnText.style.display='inline'; loader.style.display='none';
}

async function submitReset(){
  const otp=document.getElementById('reset-otp').value.trim();
  const newPassword=document.getElementById('reset-newpass').value;
  if(!otp||!newPassword){ showForgotMsg('Please fill in all fields','error'); return; }
  const btn=document.getElementById('forgot-btn2'), btnText=document.getElementById('forgot-btn2-text'), loader=document.getElementById('forgot-loader2');
  btn.disabled=true; btnText.style.display='none'; loader.style.display='block';
  document.getElementById('forgot-msg').style.display='none';
  try{
    const res=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,otp,newPassword})});
    const data=await res.json();
    if(data.success){
      showForgotMsg(data.message,'success');
      setTimeout(showLogin,1500);
    }else{
      showForgotMsg(data.message,'error');
    }
  }catch(e){
    showForgotMsg('Connection error. Try again.','error');
  }
  btn.disabled=false; btnText.style.display='inline'; loader.style.display='none';
}

// ── VERIFY EMAIL (unverified account trying to log in) ──
let pendingVerifyEmail='', pendingVerifyPassword='';

function showVerifyMsg(text,type){
  const el=document.getElementById('verify-login-msg');
  el.textContent=text; el.className='msg '+type; el.style.display='block';
}

async function doVerifyFromLogin(){
  const otp=document.getElementById('login-verify-otp').value.trim();
  if(!otp){ showVerifyMsg('Enter the code','error'); return; }
  const btn=document.getElementById('verify-login-btn'), btnText=document.getElementById('verify-login-btn-text'), loader=document.getElementById('verify-login-loader');
  btn.disabled=true; btnText.style.display='none'; loader.style.display='block';
  document.getElementById('verify-login-msg').style.display='none';
  try{
    const res=await fetch('/api/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingVerifyEmail,otp})});
    const data=await res.json();
    if(data.success){
      showVerifyMsg('Verified! Signing you in...','success');
      // Auto-login now that the account is verified
      const loginRes=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingVerifyEmail,password:pendingVerifyPassword})});
      const loginData=await loginRes.json();
      if(loginData.success){
        localStorage.setItem("biomeds_token", loginData.token);
        localStorage.setItem("biomeds_user",  JSON.stringify(loginData.user));
        setTimeout(()=>{ window.location.href="/dashboard.html"; },600);
      }else{
        setTimeout(showLogin,1200);
      }
    }else{
      showVerifyMsg(data.message,'error');
      btn.disabled=false; btnText.style.display='inline'; loader.style.display='none';
    }
  }catch(e){
    showVerifyMsg('Connection error. Try again.','error');
    btn.disabled=false; btnText.style.display='inline'; loader.style.display='none';
  }
}

async function resendLoginVerify(){
  document.getElementById('verify-login-msg').style.display='none';
  try{
    const res=await fetch('/api/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingVerifyEmail})});
    const data=await res.json();
    showVerifyMsg(data.message,data.success?'success':'error');
  }catch(e){
    showVerifyMsg('Connection error. Try again.','error');
  }
}
</script>

</script>
</body>
</html>
