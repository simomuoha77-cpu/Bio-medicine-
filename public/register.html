<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — MASTER BIOMEDS</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sora',sans-serif;
  background:#071018;color:white;
  min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:20px;
}
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(0,217,255,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 70%,rgba(0,102,255,0.06) 0%,transparent 70%);
}
.box{
  position:relative;z-index:1;
  width:440px;max-width:95vw;
  background:#0b1622;
  border:1px solid rgba(0,217,255,0.08);
  border-radius:20px;padding:44px 38px;
}
.logo{text-align:center;margin-bottom:28px;}
.logo h1{font-size:22px;font-weight:700;color:#00d9ff;margin-bottom:6px;}
.logo p{font-size:13px;color:#5a7a8a;}

/* STEPS */
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;}
.step{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:#5a7a8a;font-weight:500;
}
.step-num{
  width:24px;height:24px;border-radius:50%;
  background:#111d29;border:1px solid rgba(0,217,255,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;transition:all .3s;
}
.step.active .step-num{background:#00d9ff;border-color:#00d9ff;color:#000;}
.step.done .step-num{background:rgba(0,255,136,0.15);border-color:#00ff88;color:#00ff88;}
.step-line{width:30px;height:1px;background:rgba(0,217,255,0.15);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:600;color:#5a7a8a;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.field input{
  width:100%;background:#111d29;border:1px solid rgba(0,217,255,0.08);
  border-radius:10px;padding:13px 16px;color:white;
  font-family:'Sora',sans-serif;font-size:14px;outline:none;transition:border-color .2s;
}
.field input:focus{border-color:rgba(0,217,255,0.3);}

/* CODE INPUT */
.code-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0;}
.code-inputs input{
  width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;
  background:#111d29;border:1px solid rgba(0,217,255,0.15);
  border-radius:10px;color:#00d9ff;font-family:'Sora',sans-serif;outline:none;
  transition:border-color .2s;
}
.code-inputs input:focus{border-color:#00d9ff;}

.btn-submit{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#00d9ff,#0066ff);
  border:none;border-radius:10px;color:#000;font-family:'Sora',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:4px;
}
.btn-submit:hover{opacity:.88;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}

.msg{
  text-align:center;font-size:13px;margin-top:12px;
  padding:10px;border-radius:8px;display:none;
}
.msg.error{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);color:#ff4757;}
.msg.success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.2);color:#00ff88;}
.msg.info{background:rgba(0,217,255,0.08);border:1px solid rgba(0,217,255,0.2);color:#00d9ff;}

.bottom{text-align:center;margin-top:18px;font-size:13px;color:#5a7a8a;}
.bottom a{color:#00d9ff;text-decoration:none;font-weight:600;}
.bottom a:hover{text-decoration:underline;}

.email-hint{
  text-align:center;font-size:13px;color:#5a7a8a;
  margin-bottom:16px;line-height:1.6;
}
.email-hint span{color:#00d9ff;font-weight:600;}
</style>
</head>
<body>
<div class="bg"></div>

<div class="box">
  <div class="logo">
    <h1><i class="fa-solid fa-heart-pulse"></i> MASTER BIOMEDS</h1>
    <p>Create your account</p>
  </div>

  <!-- STEPS -->
  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      <span>Details</span>
    </div>
    <div class="step-line"></div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      <span>Verify</span>
    </div>
    <div class="step-line"></div>
    <div class="step" id="step3">
      <div class="step-num">3</div>
      <span>Done</span>
    </div>
  </div>

  <!-- STEP 1 — Register Form -->
  <div id="form-register">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="reg-name" placeholder="John Doe" autocomplete="name">
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-pass" placeholder="Min 6 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="reg-btn" onclick="doRegister()">
      <i class="fa-solid fa-user-plus"></i> Create Account
    </button>
    <div class="msg" id="reg-msg"></div>
    <div class="bottom">Already have an account? <a href="/login.html">Login here</a></div>
  </div>

  <!-- STEP 2 — Verify Code -->
  <div id="form-verify" style="display:none;">
    <div class="email-hint">
      We sent a 6-digit code to<br>
      <span id="verify-email-show"></span>
    </div>
    <div class="code-inputs">
      <input type="text" maxlength="1" id="c1" oninput="codeMove(this,'c2')" onkeydown="codeBack(event,this,null)">
      <input type="text" maxlength="1" id="c2" oninput="codeMove(this,'c3')" onkeydown="codeBack(event,this,'c1')">
      <input type="text" maxlength="1" id="c3" oninput="codeMove(this,'c4')" onkeydown="codeBack(event,this,'c2')">
      <input type="text" maxlength="1" id="c4" oninput="codeMove(this,'c5')" onkeydown="codeBack(event,this,'c3')">
      <input type="text" maxlength="1" id="c5" oninput="codeMove(this,'c6')" onkeydown="codeBack(event,this,'c4')">
      <input type="text" maxlength="1" id="c6" oninput="codeMove(this,null)"  onkeydown="codeBack(event,this,'c5')">
    </div>
    <button class="btn-submit" id="verify-btn" onclick="doVerify()">
      <i class="fa-solid fa-check-circle"></i> Verify Code
    </button>
    <div class="msg" id="verify-msg"></div>
    <div class="bottom" style="margin-top:14px;">
      <a href="#" onclick="resendCode()">Resend code</a>
    </div>
  </div>

  <!-- STEP 3 — Success -->
  <div id="form-done" style="display:none;text-align:center;padding:20px 0;">
    <i class="fa-solid fa-circle-check" style="font-size:56px;color:#00ff88;margin-bottom:16px;display:block;"></i>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:8px;">Account Created!</h2>
    <p style="color:#5a7a8a;font-size:14px;margin-bottom:24px;">Your account is verified. Redirecting to login...</p>
    <a href="/login.html">
      <button class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Go to Login</button>
    </a>
  </div>

</div>

<script>
let registeredEmail = "";

// If already logged in
if (localStorage.getItem("biomeds_token")) {
  window.location.href = "/dashboard.html";
}

// ── REGISTER ──
async function doRegister() {
  const username = document.getElementById("reg-name").value.trim();
  const email    = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-pass").value;
  const pass2    = document.getElementById("reg-pass2").value;
  const btn      = document.getElementById("reg-btn");

  hideMsg("reg-msg");

  if (!username || !email || !password || !pass2) {
    showMsg("reg-msg", "All fields are required", "error"); return;
  }
  if (password.length < 6) {
    showMsg("reg-msg", "Password must be at least 6 characters", "error"); return;
  }
  if (password !== pass2) {
    showMsg("reg-msg", "Passwords do not match", "error"); return;
  }

  btn.disabled   = true;
  btn.textContent = "Sending code...";

  try {
    const res  = await fetch("/register", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, email, password })
    });
    const data = await res.json();

    if (data.success) {
      registeredEmail = email;
      document.getElementById("verify-email-show").textContent = email;
      // Switch to step 2
      document.getElementById("form-register").style.display = "none";
      document.getElementById("form-verify").style.display   = "block";
      // Update steps
      document.getElementById("step1").classList.remove("active");
      document.getElementById("step1").classList.add("done");
      document.getElementById("step2").classList.add("active");
      document.getElementById("c1").focus();
    } else {
      showMsg("reg-msg", data.message || "Registration failed", "error");
      btn.disabled    = false;
      btn.innerHTML   = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
  } catch {
    showMsg("reg-msg", "Connection error. Is the server running?", "error");
    btn.disabled    = false;
    btn.innerHTML   = '<i class="fa-solid fa-user-plus"></i> Create Account';
  }
}

// ── VERIFY ──
async function doVerify() {
  const code = ["c1","c2","c3","c4","c5","c6"].map(id => document.getElementById(id).value).join("");
  const btn  = document.getElementById("verify-btn");

  hideMsg("verify-msg");

  if (code.length < 6) {
    showMsg("verify-msg", "Enter the full 6-digit code", "error"); return;
  }

  btn.disabled    = true;
  btn.textContent = "Verifying...";

  try {
    const res  = await fetch("/verify", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ email: registeredEmail, code })
    });
    const data = await res.json();

    if (data.success) {
      // Update steps
      document.getElementById("step2").classList.remove("active");
      document.getElementById("step2").classList.add("done");
      document.getElementById("step3").classList.add("active");
      // Show done screen
      document.getElementById("form-verify").style.display = "none";
      document.getElementById("form-done").style.display   = "block";
      // Auto redirect to login after 2.5s
      setTimeout(() => { window.location.href = "/login.html"; }, 2500);
    } else {
      showMsg("verify-msg", data.message || "Invalid code", "error");
      btn.disabled  = false;
      btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Verify Code';
    }
  } catch {
    showMsg("verify-msg", "Connection error", "error");
    btn.disabled  = false;
    btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Verify Code';
  }
}

async function resendCode() {
  showMsg("verify-msg", "Resending code...", "info");
  // Just re-trigger — user needs to go back and register again
  // Or you can add a resend endpoint
  showMsg("verify-msg", "Please go back and register again to get a new code", "info");
}

// ── CODE INPUT HELPERS ──
function codeMove(el, nextId) {
  el.value = el.value.replace(/\D/g, ""); // numbers only
  if (el.value && nextId) {
    document.getElementById(nextId).focus();
  }
  // Auto submit when all 6 filled
  const code = ["c1","c2","c3","c4","c5","c6"].map(id => document.getElementById(id).value).join("");
  if (code.length === 6) doVerify();
}

function codeBack(e, el, prevId) {
  if (e.key === "Backspace" && !el.value && prevId) {
    document.getElementById(prevId).focus();
  }
}

// ── MSG HELPERS ──
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent   = text;
  el.className     = "msg " + type;
  el.style.display = "block";
}

function hideMsg(id) {
  document.getElementById(id).style.display = "none";
}
</script>
</body>
</html>
