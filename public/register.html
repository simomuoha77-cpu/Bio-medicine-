<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — MASTER BIOMEDS</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sora',sans-serif;
  background:#071018;color:white;
  min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:20px;
}
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(0,217,255,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 70%,rgba(0,102,255,0.06) 0%,transparent 70%);
}
.box{
  position:relative;z-index:1;
  width:440px;max-width:95vw;
  background:#0b1622;
  border:1px solid rgba(0,217,255,0.08);
  border-radius:20px;padding:44px 38px;
}
.logo{text-align:center;margin-bottom:32px;}
.logo h1{font-size:22px;font-weight:700;color:#00d9ff;margin-bottom:6px;}
.logo p{font-size:13px;color:#5a7a8a;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:600;color:#5a7a8a;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.field input{
  width:100%;background:#111d29;border:1px solid rgba(0,217,255,0.08);
  border-radius:10px;padding:13px 16px;color:white;
  font-family:'Sora',sans-serif;font-size:14px;outline:none;transition:border-color .2s;
}
.field input:focus{border-color:rgba(0,217,255,0.3);}

/* Password strength */
.pwd-strength{height:3px;border-radius:2px;margin-top:6px;transition:all .3s;background:#111d29;}
.pwd-strength.weak{background:#ff4757;width:33%;}
.pwd-strength.medium{background:#ff9f43;width:66%;}
.pwd-strength.strong{background:#00ff88;width:100%;}

.btn-submit{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#00d9ff,#0066ff);
  border:none;border-radius:10px;color:#000;font-family:'Sora',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{opacity:.88;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}

.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg)}}

.msg{text-align:center;font-size:13px;margin-top:12px;padding:10px;border-radius:8px;display:none;}
.msg.error{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);color:#ff4757;}
.msg.success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.2);color:#00ff88;}

.bottom{text-align:center;margin-top:20px;font-size:13px;color:#5a7a8a;}
.bottom a{color:#00d9ff;text-decoration:none;font-weight:600;}
.bottom a:hover{text-decoration:underline;}

/* Success screen */
.done{display:none;text-align:center;padding:20px 0;}
.done i{font-size:56px;color:#00ff88;margin-bottom:16px;display:block;}
.done h2{font-size:20px;font-weight:700;margin-bottom:8px;}
.done p{color:#5a7a8a;font-size:14px;margin-bottom:24px;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="box">
  <div class="logo">
    <h1><i class="fa-solid fa-heart-pulse"></i> MASTER BIOMEDS</h1>
    <p>Create your account</p>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="reg-name" placeholder="John Doe" autocomplete="name">
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-pass" placeholder="Min 6 characters" autocomplete="new-password" oninput="checkStrength(this.value)">
      <div class="pwd-strength" id="pwd-bar"></div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="reg-btn" onclick="doRegister()">
      <i class="fa-solid fa-user-plus"></i> Create Account
    </button>
    <div class="msg" id="reg-msg"></div>
    <div class="bottom">Already have an account? <a href="/login.html">Login here</a></div>
  </div>

  <!-- SUCCESS -->
  <div class="done" id="form-done">
    <i class="fa-solid fa-circle-check"></i>
    <h2>Account Created!</h2>
    <p>Welcome to Master Biomeds. Redirecting to login...</p>
    <a href="/login.html">
      <button class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Go to Login</button>
    </a>
  </div>
</div>

<script>
if (localStorage.getItem("biomeds_token")) {
  window.location.href = "/dashboard.html";
}

function checkStrength(val) {
  const bar = document.getElementById("pwd-bar");
  if (!val) { bar.className = "pwd-strength"; return; }
  if (val.length < 6) bar.className = "pwd-strength weak";
  else if (val.length < 10) bar.className = "pwd-strength medium";
  else bar.className = "pwd-strength strong";
}

async function doRegister() {
  const username = document.getElementById("reg-name").value.trim();
  const email    = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-pass").value;
  const pass2    = document.getElementById("reg-pass2").value;
  const btn      = document.getElementById("reg-btn");

  hideMsg("reg-msg");

  if (!username || !email || !password || !pass2) {
    showMsg("reg-msg","All fields are required","error"); return;
  }
  if (password.length < 6) {
    showMsg("reg-msg","Password must be at least 6 characters","error"); return;
  }
  if (password !== pass2) {
    showMsg("reg-msg","Passwords do not match","error"); return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Creating account...';

  try {
    const res  = await fetch("/register", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, email, password })
    });
    const data = await res.json();

    if (data.success) {
      document.getElementById("form-register").style.display = "none";
      document.getElementById("form-done").style.display = "block";
      setTimeout(() => { window.location.href = "/login.html"; }, 2500);
    } else {
      showMsg("reg-msg", data.message || "Registration failed", "error");
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
  } catch {
    showMsg("reg-msg","Connection error. Please try again.","error");
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
  }
}

// Allow Enter key
document.addEventListener("keydown", e => {
  if (e.key === "Enter") doRegister();
});

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text; el.className = "msg " + type; el.style.display = "block";
}
function hideMsg(id) {
  document.getElementById(id).style.display = "none";
}
</script>
</body>
</html>
